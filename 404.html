<html>

    <noscript>
      <meta
        http-equiv="refresh"
        content="2; url=https://boosty.to/capitalgain"
      />
    </noscript>

    <script>
      (function () {
        const path = window.location.pathname;
        const search = window.location.search;

        // 1. Скачивание файлов WooCommerce
        if (search.includes("download_file")) {
          window.location.replace("https://boosty.to/capitalgain");
          return;
        }

        // 2. Старые ссылки на инструменты
        const appRoutes = {
          "/backtest": "/app/#/backtest",
          "/rebalance": "/app/#/rebalance",
          "/funds-compare": "/app/#/funds/compare",
          "/funds-analyse": "/app/#/funds/analyse",
          "/planning": "/app/#/planning",
          "/monte-carlo": "/app/#/planning",
        };

        for (const [oldPath, newHashRoute] of Object.entries(appRoutes)) {
          if (path.startsWith(oldPath)) {
            window.location.replace(newHashRoute);
            return;
          }
        }

        // Корневой редирект в инструменты
        if (path === "/" || path === "") {
          window.location.replace("/app/");
          return;
        }

        // 3. Блог
        if (
          path.startsWith("/posts/") ||
          path.startsWith("/talking-millions/")
        ) {
          let slug = path.split("/")[2];
          if (path.startsWith("/talking-millions/")) {
            slug = "talking-millions";
          } else if (slug) {
            slug = slug.replace(/\/$/, ""); // убираем trailing slash
          }

          const oldCourseParts = [
            "key-terms",
            "compound-growth",
            "asset-classes-indexes-and-funds",
            "risk-and-returns",
            "investment-risk",
            "stocks-returns-distribution",
            "return-and-risk-calculation",
            "charts-scale",
            "planning",
            "active-investing",
            "asset-allocation-portfolio-effect",
            "passive-investing",
            "portfolio-contributions",
            "asset-allocation",
            "global-diversification",
            "bonds",
            "home-country-bias",
            "global-weighting",
            "portfolios-examples",
            "funds-history",
            "investment-funds",
            "brokers",
            "funds-selection",
            "etf",
            "taxes",
            "deep-risk",
            "inflation-and-real-returns",
            "trading",
            "money-market",
            "stocks",
            "bonds-selection",
            "talking-millions",
          ];

          const substackPosts = [
            "changelog-december-2019",
            "changelog-january-2020",
            "vtbx-fund-analysis",
            "new-rebalancing-tool",
            "changelog-march-2021",
            "stats-announce",
            "portfolio-performance-usage",
            "changelog-august-2022",
            "backtester-extended-data",
            "fin-plan-v-2",
            "fin-plan-flexible-spending-strategy",
            "changelog-february-2023",
            "changelog-august-2023",
            "changelog-september-2023",
            "index-funds-comparison-10-2023",
            "2023-assets-results",
            "cape-moex",
            "changelog-march-2024",
            "optimal-rebalancing-period",
            "index-funds-comparison-10-2024",
            "changelog-december-2024",
            "2024-assets-results",
            "changelog-may-2025",
            "retirement-spending-smile",
            "changelog-october-2025",
            "index-funds-comparison-10-2025",
            "2025-assets-results",
            "sustainbable-withdrawal-rate",
            "changelog-march-2026",
          ];

          if (substackPosts.includes(slug)) {
            window.location.replace(
              "https://capitalgainru.substack.com/p/" + slug,
            );
          } else if (oldCourseParts.includes(slug)) {
            window.location.replace(
              "https://boosty.to/capitalgain/posts/f975bd58-7233-473d-8722-67d2961b3918",
            );
          } else {
            window.location.replace("https://boosty.to/capitalgain");
          }
          return;
        }

        window.location.replace("https://boosty.to/capitalgain");
      })();
    </script>
