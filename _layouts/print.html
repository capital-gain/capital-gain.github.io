<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>{{ page.title }}</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css"
      integrity="sha384-u1zONI5gPXUx0UKI62c75/zww972y0v2rSK5ZYlVdS6xEuWDeZWUI66v6t1gvlXJ"
      crossorigin="anonymous" />

    <style>
      /* Стили для экрана и печати */
      body {
        font-family: 'PT Serif', Georgia, serif;
        line-height: 1.6;
        color: #1a1a1a;
      }

      @media print {
        @page {
          size: A4;
          margin: 15mm 10mm;
        }
        h1,
        h2,
        h3 {
          page-break-after: avoid;
        }
        table {
          page-break-inside: avoid;
          border-collapse: collapse;
          width: 100%;
        }
        tr {
          page-break-inside: avoid;
          page-break-after: auto;
        }
        thead {
          display: table-header-group;
        } /* Повторять шапку на каждой странице */
        pre {
          margin: 1em 0;
          page-break-inside: avoid;
        }
        mark {
          background-color: #fafad2;
        }
        img {
          max-width: 100% !important;
        }
        .no-print {
          display: none;
        }
        .page-break {
          page-break-before: always;
        }
      }

      /* Оформление таблиц (важно для расчетов SWR) */
      table {
        margin: 1em 0;
        border: 1px solid #ccc;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
        font-size: 10pt;
      }
      th {
        background-color: #f5f5f5;
      }

      figure {
        margin: 1em 0;
      }

      blockquote {
        margin: 1em 0;
        color: #444;
        border-left: 4px solid #aaa;
        padding-left: 10px;
      }

      blockquote > :last-child {
        margin-bottom: 0;
      }

      blockquote cite {
        font-size: 0.9em;
        font-style: italic;
      }

      blockquote cite:before {
        content: '— ';
      }

      /* Титульная страница */
      .title-page {
        height: 99vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        page-break-after: always;
      }

      /* Стили содержания */
      .toc-page {
        page-break-after: always;
      }

      .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .toc-list li {
        margin-bottom: 8px;
      }

      .toc-list a {
        display: flex;
        align-items: baseline;
        text-decoration: none;
        color: #0056b3; /* Классический синий цвет ссылки */
      }

      .toc-list a:hover {
        text-decoration: underline;
      }

      .toc-title {
        flex-shrink: 1;
        font-weight: 500;
      }

      /* Эффект точек-заполнителей */
      .toc-filler {
        flex-grow: 1;
        border-bottom: 1px dotted #ccc;
        margin: 0 10px;
        position: relative;
        top: -1px; /* Поднимаем точки чуть выше базовой линии */
      }

      .toc-date {
        flex-shrink: 0;
        font-family:
          'Courier New', monospace; /* Моноширинный шрифт для дат выглядит аккуратно */
        font-size: 0.9em;
        color: #666;
      }
    </style>
  </head>
  <body>
    {{ content }}
  </body>
</html>
